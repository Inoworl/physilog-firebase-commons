name: Deploy Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Run Firestore rules tests
        run: npm run emulator:test:ci
        env:
          CI: true
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080

      - name: Check insecure allow patterns
        run: |
          if grep -R "allow read, write: if true" security_rules/firestore; then
            echo "Insecure unconditional read/write rule found."
            exit 1
          fi
          if ! grep -q "request.auth" security_rules/firestore/firestore.rules; then
            echo "Firestore rules do not contain auth checks."
            exit 1
          fi

      - name: Detect deploy targets
        id: deploy-targets
        run: |
          if [ -d functions ]; then
            echo "targets=firestore,functions" >> "$GITHUB_OUTPUT"
          else
            echo "targets=firestore" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Functions dependencies
        if: ${{ hashFiles('functions/package.json') != '' }}
        run: |
          if [ -f functions/package-lock.json ]; then
            npm --prefix functions ci
          else
            npm --prefix functions install
          fi

      - name: Build Functions
        if: ${{ hashFiles('functions/package.json') != '' }}
        run: npm --prefix functions run build

      - name: Validate Firebase credentials secret
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing GitHub secret FIREBASE_SERVICE_ACCOUNT for the prod environment."
            exit 1
          fi
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firebase resources
        run: npx firebase-tools deploy --only "${{ steps.deploy-targets.outputs.targets }}" --project prod
