name: Terraform Validate

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "infrastructure/terraform/**"
      - "tests/revenuecat.terraform.test.js"
      - ".github/workflows/terraform-validate.yml"
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "infrastructure/terraform/**"
      - "tests/revenuecat.terraform.test.js"
      - ".github/workflows/terraform-validate.yml"

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test minimal infrastructure policy
        run: npm test -- --runInBand tests/revenuecat.terraform.test.js

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.9.7"

      - name: Check formatting
        run: terraform fmt -check -recursive
        working-directory: infrastructure/terraform/revenuecat-google-play

      - name: Initialize Terraform
        run: terraform init -backend=false -input=false
        working-directory: infrastructure/terraform/revenuecat-google-play/environments/${{ matrix.environment }}

      - name: Validate Terraform
        run: terraform validate
        working-directory: infrastructure/terraform/revenuecat-google-play/environments/${{ matrix.environment }}
