name: RevenueCat Configuration Policy

on:
  push:
    branches:
      - dev
      - main
    paths:
      - ".gitignore"
      - "docs/revenuecat-google-play-operations.md"
      - "tests/revenuecat.google-play-operations.test.js"
      - ".github/workflows/revenuecat-config-policy.yml"
  pull_request:
    branches:
      - dev
      - main
    paths:
      - ".gitignore"
      - "docs/revenuecat-google-play-operations.md"
      - "tests/revenuecat.google-play-operations.test.js"
      - ".github/workflows/revenuecat-config-policy.yml"

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test RevenueCat configuration policy
        run: npm test -- --runInBand tests/revenuecat.google-play-operations.test.js
